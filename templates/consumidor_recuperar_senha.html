{% extends "base_public.html" %}
{% block title %}Recuperar senha — Poupáqui{% endblock %}

{% block extra_style %}
<style>
.auth-wrap { max-width:460px; margin:0 auto; padding:36px 16px 70px; }
.auth-card { background:#fff; border:1px solid var(--pq-border); border-radius:16px; box-shadow:var(--pq-shadow); padding:26px; }
.auth-card h1 { font-size:1.35rem; font-weight:900; margin:0 0 6px; display:flex; align-items:center; gap:10px; }
.auth-card p { color:var(--pq-muted); margin:0 0 22px; font-size:.92rem; }
.auth-field { margin-bottom:14px; }
.auth-field label { display:block; font-size:.76rem; font-weight:900; color:var(--pq-muted); text-transform:uppercase; letter-spacing:.3px; margin-bottom:5px; }
.auth-field input { width:100%; padding:12px 14px; border:1.5px solid var(--pq-border); border-radius:10px; font-family:inherit; outline:none; }
.auth-field input:focus { border-color:var(--pq-red); }
.auth-btn { width:100%; border:0; background:var(--pq-red); color:#fff; border-radius:12px; padding:13px 18px; font-weight:900; font-family:inherit; cursor:pointer; }
.auth-link { display:block; text-align:center; margin-top:16px; color:var(--pq-red); font-weight:800; text-decoration:none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <form class="auth-card" method="post" action="{{ url_for('recuperar_senha_post') }}">
    <h1><i class="fa fa-key" style="color:var(--pq-red)"></i>Recuperar senha</h1>
    <p>Informe seu e-mail de cadastro e enviaremos um link para criar uma nova senha.</p>

    <div class="auth-field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="seu@email.com">
    </div>
    <button class="auth-btn" type="submit">Enviar link de recuperação</button>
    <a class="auth-link" href="{{ url_for('consumidor_login') }}">Voltar para o login</a>
  </form>
</div>
{% endblock %}
